apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "kotlin-kapt"
apply plugin: "dagger.hilt.android.plugin" // Added Hilt plugin

/**
 * Official Android configuration for NFC Manager
 * Built with Kotlin and Jetpack Compose
 * 
 * Dependency versions updated: 2025-10-16
 * - All updates are Minor/Patch (safe, no breaking changes)
 * - Compose BOM: 2024.02.02 -> 2024.04.00
 * - Room: 2.6.0 -> 2.6.1
 * - Navigation: 2.7.5 -> 2.7.7
 * - WorkManager: 2.8.1 -> 2.9.0
 */


/**
 * Set this to true to create four separate APKs instead of one,
 * one for each native architecture. This is useful if you don't
 * use App Bundles (https://developer.android.com/guide/app-bundle/)
 * and want to have separate APKs to upload to the Play Store.
 */
def enableSeparateBuildPerCPUArchitecture = false

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * Android build configuration
 * Pure Kotlin + Jetpack Compose project
 */

android {
    ndkVersion rootProject.ext.ndkVersion
    compileSdkVersion rootProject.ext.compileSdkVersion

    namespace 'com.dxbmark.nfcmanager'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
        viewBinding true
        buildConfig true
    }

    lint {
        // Disable false positive lint errors for backup rules
        disable 'FullBackupContent'
        abortOnError false
        checkReleaseBuilds true
    }

    composeOptions {
        // Compose Compiler version - Compatible with Kotlin 1.9.22
        kotlinCompilerExtensionVersion = "1.5.10"
    }

    defaultConfig {
        applicationId 'com.dxbmark.nfcmanager'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
        
        // NFC Manager specific configurations
        multiDexEnabled true
        
        // Ensure minimum SDK supports NFC (Android 11+ for enhanced security)
        minSdkVersion Math.max(rootProject.ext.minSdkVersion, 30)
    }

    signingConfigs {
        debug {
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('MYAPP_UPLOAD_STORE_FILE')) {
                storeFile file(MYAPP_UPLOAD_STORE_FILE)
                storePassword MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias MYAPP_UPLOAD_KEY_ALIAS
                keyPassword MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            debuggable false
            zipAlignEnabled true
        }
    }

    splits {
        abi {
            reset()
            enable enableSeparateBuildPerCPUArchitecture
            universalApk false  // If true, also generate a universal APK
            include "armeabi-v7a", "x86", "arm64-v8a", "x86_64"
        }
    }

    sourceSets {
        main {
            java.srcDirs += 'src/main/kotlin'
        }
    }
    packagingOptions {
        jniLibs {
            pickFirsts += ['lib/x86/libc++_shared.so', 'lib/x86_64/libc++_shared.so', 'lib/arm64-v8a/libc++_shared.so', 'lib/armeabi-v7a/libc++_shared.so']
        }
    }

}

dependencies {
    // Android Core Libraries
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    
    // Multidex support
    implementation 'androidx.multidex:multidex:2.0.1'

    // Jetpack Compose BOM (Updated to 2024.04.00 - Minor update, safe)
    implementation platform('androidx.compose:compose-bom:2024.04.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended' // Added for extended icons
    implementation 'androidx.activity:activity-compose:1.8.1'
    
    // ViewModel + LiveData (Official Android Jetpack)
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    
    // Room Database (Official Google Database - Updated to 2.6.1)
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    
    // Navigation Component (Official Navigation - Updated to 2.7.7)
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    
    // WorkManager (Background Tasks - Updated to 2.9.0)
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    
    // Kotlin Coroutines (Asynchronous Programming)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Hilt Dependencies (Added)
    implementation "com.google.dagger:hilt-android:$rootProject.hilt_version"
    kapt "com.google.dagger:hilt-compiler:$rootProject.hilt_version"
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0' // Added for Hilt Compose Navigation
    
    // Debug tools for Jetpack Compose
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

}

// Pure Android project - Built with Kotlin & Jetpack Compose
