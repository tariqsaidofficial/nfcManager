// Top-level build file - Official Google repositories only
// NFC Manager - Dependency Versions (Last Updated: 2025-10-16)
buildscript {
    // Kotlin version - Compatible with Compose Compiler 1.5.10
    ext.kotlin_version = '1.9.22'
    
    // Hilt version - Stable and compatible with Kotlin 1.9.22
    ext.hilt_version = '2.50'

    ext {
        compileSdkVersion = 34
        targetSdkVersion = 34
        minSdkVersion = 30
        ndkVersion = "25.1.8937393"
    }

    repositories {
        // Official Google Maven Repository
        google()
        // Official Maven Central
        mavenCentral()
        // Official Gradle Plugin Portal
        gradlePluginPortal()
    }

    dependencies {
        // Official Android Gradle Plugin (Stable version)
        // Fixed: 8.13.0 doesn't exist, downgraded to stable 8.2.2
        classpath 'com.android.tools.build:gradle:8.13.0'
        
        // Kotlin Gradle Plugin
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        
        // Hilt Android Gradle Plugin
        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
        
        // Google Services Plugin for Firebase (Latest version)
        classpath 'com.google.gms:google-services:4.4.4'
    }
}

// Note: allprojects repositories are now defined in settings.gradle
// This block is kept for backward compatibility but repositories
// should be managed in settings.gradle (dependencyResolutionManagement)
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

gradle.projectsEvaluated {
    tasks.withType(JavaCompile) {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }
}