pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url "https://www.jitpack.io" }
        // React Native modules
        maven { url("https://maven.google.com") }
        maven { url("https://jcenter.bintray.com/") }
        maven { url("https://oss.sonatype.org/content/repositories/snapshots/") }
    }
}

rootProject.name = 'nfc-manager'
include ':app'

// Expo modules
apply from: new File(["node", "--print", "require.resolve('expo/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/scripts/autolinking.gradle";
useExpoModules()

// React Native modules
apply from: new File(["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/native_modules.gradle";
applyNativeModulesSettingsGradle(settings)
